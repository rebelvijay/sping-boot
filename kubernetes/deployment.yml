apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-demo
  labels:
    app: springboot-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: springboot-demo

  template:
    metadata:
      labels:
        app: springboot-demo

    spec:
      containers:
      - name: springboot-demo
        image: vijaykumarkotikilapudi/springboot-demo:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8081